name: Build e deploy Windows da main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar e validar pelo mesmo comando local
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/Build-Windows.ps1 -Architecture ${{ matrix.architecture }} -Revision ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: RestauranteLocal-windows-${{ matrix.architecture }}
          path: |
            dist/RestauranteLocal-windows-${{ matrix.architecture }}.zip
            dist/RestauranteLocal-windows-${{ matrix.architecture }}.zip.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: update-web-${{ matrix.architecture }}
          path: dist/update-web
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RestauranteLocal-windows-*
          merge-multiple: true
          path: dist
      - name: Publicar os dois pacotes na mesma Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REVISION: ${{ github.sha }}
        run: |
          tag="windows-$BUILD_REVISION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/*.zip dist/*.sha256 --target "$BUILD_REVISION" --title "Restaurante Local — Windows (${BUILD_REVISION:0:7})" --notes-file packaging/RELEASE_NOTES.md --latest
          fi
  deploy:
    needs: [build, release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: update-web-*
          merge-multiple: true
          path: update-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: update-web
      - uses: actions/deploy-pages@v4
        id: deployment
