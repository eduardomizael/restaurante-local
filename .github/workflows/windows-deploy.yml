name: Build e deploy Windows da main
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            python: cpython-3.13-windows-x86_64-none
          - architecture: x86
            python: cpython-3.13-windows-x86-none
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.26'
      - name: Preparar RTK para testes do inicializador de desenvolvimento
        run: |
          $toolsDirectory = Join-Path $env:RUNNER_TEMP 'rtk-0.45.0'
          $archive = Join-Path $env:RUNNER_TEMP 'rtk.zip'
          Invoke-WebRequest -Uri 'https://github.com/rtk-ai/rtk/releases/download/v0.45.0/rtk-x86_64-pc-windows-msvc.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $toolsDirectory
          $executable = Get-ChildItem -LiteralPath $toolsDirectory -Filter rtk.exe -Recurse | Select-Object -First 1
          if (-not $executable) { throw 'Pacote RTK sem executável.' }
          $executable.DirectoryName >> $env:GITHUB_PATH
          & $executable.FullName --version
      - run: uv sync --frozen --group build
      - run: uv run --no-sync python manage.py check --settings=config.test_settings
      - run: uv run --no-sync python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: uv run --no-sync python manage.py test --settings=config.test_settings
      - name: Compilar
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: uv run --no-sync python packaging/build.py --version 0.1.0 --revision $env:BUILD_REVISION
      - run: uv run --no-sync python packaging/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: RestauranteLocal-windows-${{ matrix.architecture }}
          path: |
            dist/RestauranteLocal-windows-${{ matrix.architecture }}.zip
            dist/RestauranteLocal-windows-${{ matrix.architecture }}.zip.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: update-web-${{ matrix.architecture }}
          path: dist/update-web
  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RestauranteLocal-windows-*
          merge-multiple: true
          path: dist
      - name: Publicar os dois pacotes na mesma Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REVISION: ${{ github.sha }}
        run: |
          tag="windows-$BUILD_REVISION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/*.zip dist/*.sha256 --target "$BUILD_REVISION" --title "Restaurante Local — Windows (${BUILD_REVISION:0:7})" --notes-file packaging/RELEASE_NOTES.md --latest
          fi
  deploy:
    needs: [build, release]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: update-web-*
          merge-multiple: true
          path: update-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: update-web
      - uses: actions/deploy-pages@v4
        id: deployment
