[project]
name = "local-weighing"
version = "0.1.0"
description = "Aplicação local de pesagem e comandas"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django==5.2.17",
    "waitress==3.0.2",
    "pystray==0.19.5",
    "Pillow==11.3.0",
    "pyserial==3.5",
    "django-environ==0.14.0",
]

[tool.uv]
package = false

[dependency-groups]
build = [
    "pyinstaller==6.22.0",
]
