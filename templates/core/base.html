<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ application_name }}</title>
  <link rel="stylesheet" href="{% url 'asset' 'app.css' %}">
  <script src="{% url 'asset' 'htmx.min.js' %}" defer></script>
  <script src="{% url 'asset' 'app.js' %}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}" data-selected-order="{{ selected_id|default_if_none:'' }}">
  {% include 'core/navbar.html' %}
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  {% include 'core/keypad.html' %}
  {% block dialogs %}{% endblock %}
  {% if not history_page %}
  <dialog id="change-history-dialog" aria-labelledby="change-history-title"><div id="change-history-content"></div></dialog>
  <div hidden hx-get="{% url 'change_history' %}?automatic=1" hx-trigger="load" hx-target="#change-history-content" hx-swap="innerHTML"></div>
  {% endif %}
</body>
</html>
