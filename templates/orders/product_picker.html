{% load commercial %}
<section id="product-picker" class="product-picker" {% if not selected %}hidden{% endif %} {% if out_of_band %}hx-swap-oob="outerHTML"{% endif %}>
  {% if selected %}
  <div class="panel-heading"><div><h2>Adicionar produtos</h2><p class="muted">Destino: comanda {{ selected.number }}</p></div><span class="tag">Aberta</span></div>
  <div class="product-selection">
  <section class="quick-products-section" aria-labelledby="quick-products-title"><h3 id="quick-products-title">Acesso rápido</h3>
    {% include 'orders/quick_products.html' %}
  </section>
  <section class="catalogue-search" aria-label="Catálogo completo">
    <form method="get" action="{{ product_search_url }}" class="search-form" hx-get="{% url 'product_choices' %}" hx-target="#catalogue-choices" hx-swap="outerHTML" hx-sync="#attendance-workspace:drop">
      <input type="hidden" name="order" value="{{ selected.pk }}"><label for="product-search">Buscar produto</label><input id="product-search" name="q" value="{{ search }}" placeholder="Nome do produto"><button type="submit" class="secondary compact">⌕ Buscar</button>
      {% if not compact_attendance %}<input type="hidden" name="layout" value="alternative">{% endif %}
    </form>
    {% include 'orders/product_choices.html' %}
  </section>
  </div>
  {% endif %}
</section>
