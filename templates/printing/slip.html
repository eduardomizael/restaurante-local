<div class="slip-preview">
  <label class="check-label slip-zoom"><input type="checkbox"> Ampliar prévia para leitura</label>
  <div class="slip-container">{% if slip_header %}<div class="order-slip" aria-label="Conteúdo completo da comanda">{% if slip_logo %}<img class="slip-logo" src="data:image/png;base64,{{ slip_logo.png_base64 }}" width="{{ slip_logo.width }}" height="{{ slip_logo.height }}" style="--logo-width: {{ slip_logo.width }}" alt="Logo do restaurante">{% endif %}<pre class="slip-header header-scale-{{ slip_header_scale }}">{{ slip_header }}</pre><pre class="slip-body">{% for line in slip_body_lines %}{% if line.bold %}<strong>{{ line.text }}</strong>{% else %}{{ line.text }}{% endif %}{% empty %}{{ slip_body }}{% endfor %}</pre></div>{% else %}<pre class="order-slip" aria-label="Conteúdo completo da comanda">{{ slip_text }}</pre>{% endif %}</div>
</div>
