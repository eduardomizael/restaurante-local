{% load commercial %}
<div class="dialog-heading"><h2 id="scale-product-title">Produto da balança</h2><button type="button" class="secondary compact" data-close-scale-product aria-label="Fechar seleção do produto da balança">× Fechar</button></div>
<div id="scale-product-feedback" class="form-errors" role="alert">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div>
<div class="scale-product-options">
{% for product in products %}
  <form method="post" action="{% url 'choose_scale_product' %}{{ attendance_layout_suffix }}"
        hx-post="{% url 'choose_scale_product' %}{{ attendance_layout_suffix }}" hx-target="#scale-product-content" hx-swap="innerHTML"
        hx-sync="#scale-product-dialog:drop" hx-disabled-elt="#scale-product-dialog button">
    {% csrf_token %}<input type="hidden" name="product_id" value="{{ product.pk }}"><input type="hidden" name="expected_revision" value="{{ product.revision }}">
    <button type="submit" class="{% if not product.is_scale_product %}secondary{% endif %}"><strong>{{ product.description }}</strong><span>R$ {{ product.unit_price_cents|money }}/kg{% if product.is_scale_product %} · Atual{% endif %}</span></button>
  </form>
{% empty %}<p>Nenhum produto ativo por kg. <a href="{% url 'catalogue' %}">Cadastrar produto</a></p>{% endfor %}
</div>
